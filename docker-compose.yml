version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: visaguide-postgres
    environment:
      POSTGRES_DB: visaguide
      POSTGRES_USER: visaguide
      POSTGRES_PASSWORD: visaguide_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: visaguide-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
